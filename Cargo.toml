[package]
name = "identity"
version = "0.1.0"
edition = "2021"
default-run = "identity"

[build-dependencies]
tonic-build = "0.12"

[dependencies]
axum = "0.8.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "macros", "chrono", "uuid", "migrate"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
headers = "0.4"
jsonwebtoken = "9"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
philand_logging = { package = "logging", path = "../libs/logging" }
philand_crypto = { package = "crypto", path = "../libs/crypto" }
philand_random = { package = "random", path = "../libs/random" }
philand_validator = { package = "validator", path = "../libs/validator" }
philand_error = { package = "error", path = "../libs/error", features = ["utoipa"] }
philand_configs = { package = "configs", path = "../libs/configs" }
philand_storage = { package = "storage", path = "../libs/storage" }
philand_table = { path = "./libs/table" }
philand_application = { package = "application", path = "../libs/application" }
philand_env = { package = "env", path = "../libs/env" }
philand_queue = { package = "queue", path = "../libs/queue" }
philand_notify = { package = "notify", path = "../libs/notify" }
philand_ssh = { package = "ssh", path = "../libs/ssh" }
philand_time = { package = "time", path = "../libs/time" }

[dev-dependencies]
serial_test = "3"

[[bin]]
name = "migrate_schemas"
path = "src/bin/migrate_schemas.rs"

[[bin]]
name = "fix_migrations"
path = "src/bin/fix_migrations.rs"

[[bin]]
name = "drop_defaultdb"
path = "src/bin/drop_defaultdb.rs"

[[bin]]
name = "drop_philand"
path = "src/bin/drop_philand.rs"

[[bin]]
name = "backfill_display_name"
path = "src/bin/backfill_display_name.rs"

[[bin]]
name = "fix_identity_schema"
path = "src/bin/fix_identity_schema.rs"

[[bin]]
name = "bootstrap_v1_orgs"
path = "src/bin/bootstrap_v1_orgs.rs"

[[bin]]
name = "migrate_v1_to_v2"
path = "src/bin/migrate_v1_to_v2.rs"
